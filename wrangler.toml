name = "githubdl"
main = ".open-next/worker.js"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Self-reference service binding required by OpenNext caching.
# See https://opennext.js.org/cloudflare/caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "githubdl"

# KV — application data store (releases blob, tags index)
[[kv_namespaces]]
binding = "KV_RELEASES"
id = "e7249552cd274fc9b2d1732541ebfb19"
preview_id = "dcc5c5c2c6724096872bcad40ee60c68"

# R2 — OpenNext incremental cache
# Binding name MUST be NEXT_INC_CACHE_R2_BUCKET — hardcoded in
# @opennextjs/cloudflare's r2-incremental-cache override.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "githubdl-inc-cache"

# D1 — OpenNext tag cache
# Binding name MUST be NEXT_TAG_CACHE_D1 — hardcoded in
# @opennextjs/cloudflare's d1-next-tag-cache override.
[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "githubdl-tag-cache"
database_id = "0e085d3e-4b3e-4611-acd9-12e533d1ab62"

# Durable Objects — OpenNext revalidation queue
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

# Workers Rate Limiting bindings
[[unsafe.bindings]]
name = "RATE_LIMIT_GENERAL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMIT_VERSION"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Workers Analytics Engine — download_click custom events
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "githubdl_events"
